  sGhostReplayRecordingPtr: PTR_RESTORE_REF

  gCurrentCourseInfo: PTR_RESTORE_REF
  sLastSegmentChunk: PTR_RESTORE_REF
  sCourseDisp: PTR_RESTORE_REF
  D_800F89B8: PTR_RESTORE_REF
  D_800F89BC: PTR_RESTORE_REF
  D_800F89C8: PTR_RESTORE_REF
