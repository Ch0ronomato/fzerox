# Pointer policies for main race overlay
# Policies:
#   PTR_LEAVE_AS_IS  - don't touch on restore (rodata/static tables/function pointers)
#   PTR_RESTORE_REF  - restore as relocatable reference (arena/span + offset)
#   PTR_SET_NULL     - force NULL on restore
#   PTR_RECOMPUTE    - rebuild via post-restore hook / init logic

pointers:
  # --- Function pointer tables (static) ---
  sGamemodeInitFuncs: PTR_LEAVE_AS_IS
  sGamemodeUpdateFuncs: PTR_LEAVE_AS_IS
  sGamemodeDrawFuncs: PTR_LEAVE_AS_IS
  sCourseDecorationDrawFuncs: PTR_LEAVE_AS_IS
  sMachineLoadTexturesFuncs: PTR_LEAVE_AS_IS
  sMachineDrawFuncs: PTR_LEAVE_AS_IS
  D_800CF4B8: PTR_LEAVE_AS_IS
  sBackwardChunkGroupDrawFuncs: PTR_LEAVE_AS_IS
  sForwardChunkGroupDrawFuncs: PTR_LEAVE_AS_IS
  sCharacterBehaviorFuncs: PTR_LEAVE_AS_IS

  # --- Static pointer-to-static-struct / init-data tables ---
  sCourseVenueFloors: PTR_LEAVE_AS_IS
  sCourseSkyboxes: PTR_LEAVE_AS_IS
  sBackgroundSpriteCourseInitData: PTR_LEAVE_AS_IS
  D_800CF8C8: PTR_LEAVE_AS_IS
  D_800CDD38: PTR_LEAVE_AS_IS

  # --- Font / texture-info tables (static) ---
  sSpinningKeyboardCharacterCompTexInfo: PTR_LEAVE_AS_IS
  sFont1CompTexInfos: PTR_LEAVE_AS_IS
  sFont2CompTexInfos: PTR_LEAVE_AS_IS
  sFont3CompTexInfos: PTR_LEAVE_AS_IS
  sFont4CompTexInfos: PTR_LEAVE_AS_IS
  sFont5CompTexInfos: PTR_LEAVE_AS_IS
  sFont6CompTexInfos: PTR_LEAVE_AS_IS
  sMachineStatValueCompTexInfos: PTR_LEAVE_AS_IS
  sMachineWeightDigitCompTexInfos: PTR_LEAVE_AS_IS

  # --- Const string / const table pointers (static) ---
  gDifficultyNames: PTR_LEAVE_AS_IS
  sCharacterNames: PTR_LEAVE_AS_IS
  sTrackNames: PTR_LEAVE_AS_IS
  gMachineNames: PTR_LEAVE_AS_IS
  sCameraScissorBoxTypes: PTR_LEAVE_AS_IS

  # --- Runtime pointers (prefer relocatable restore) ---
  gCurAudioTask: PTR_RESTORE_REF
  D_800E12C0: PTR_RECOMPUTE
  sTerrainEffectVtxStart: PTR_RECOMPUTE

  sLastRacer: PTR_RECOMPUTE
  sRivalRacer: PTR_RECOMPUTE
  sPlayerRacer: PTR_RECOMPUTE

  gEffectsVtxPtr: PTR_RECOMPUTE
