  gFastestGhost: PTR_RECOMPUTE
  gFastestGhostRacer: PTR_RECOMPUTE
  sFastestGhostRacerRacer: PTR_RECOMPUTE
  sGhostReplayRecordingPtr: PTR_RECOMPUTE

  gCurrentCourseInfo: PTR_RECOMPUTE
  sLastSegmentChunk: PTR_RECOMPUTE
  sCourseDisp: PTR_RESTORE_REF
  D_800F89B8: PTR_LEAVE_AS_IS
  D_800F89BC: PTR_LEAVE_AS_IS
  D_800F89C8: PTR_LEAVE_AS_IS
  sWorkingSegmentChunk: PTR_LEAVE_AS_IS
  sWorkingNextSegmentChunk: PTR_LEAVE_AS_IS

  sTransitionPalettePtr: PTR_RESTORE_REF

  # Menus: runtime texture/palette buffers
  sRetireTexture: PTR_RESTORE_REF
  sRetirePalette: PTR_RESTORE_REF
  sWinnerTexture: PTR_RESTORE_REF
  sWinnerPalette: PTR_RESTORE_REF
  sLoserTexture: PTR_RESTORE_REF
