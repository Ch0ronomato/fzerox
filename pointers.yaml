  # --- Device/OS handles / special cases ---
  gSramPiHandlePtr: PTR_RECOMPUTE
  D_800E12B0: PTR_LEAVE_AS_IS

  # --- Derived presentation state (rebuild instead of restoring raw pointers) ---
  gCurrentTrackName: PTR_RECOMPUTE
  gTrackNames: PTR_RECOMPUTE
  sRaceMenuTextures: PTR_LEAVE_AS_IS

  # --- Mostly-null/unused ---
  sUnusedHandler: PTR_LEAVE_AS_IS
  D_i3_8013DBE8: PTR_RESTORE_REF

